[package]
name = "tactile"
version = "1.1.2-alpha.5"
description = "Tactile local workspace shell"
authors = ["Tactile contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tactile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = "2"
tauri-runtime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri's CLI enables this for production builds that embed the asset protocol.
# Keep the feature available even though the root package does not own a Tauri script.
custom-protocol = ["tauri/custom-protocol"]
