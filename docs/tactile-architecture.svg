<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Tactile workspace architecture</title>
  <desc id="desc">A Tactile workspace contains a Home sheet, embedded objects, Markdown, and separate local assets connected by stable references.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b211c" flood-opacity=".10"/>
    </filter>
    <style>
      .ink { fill: #292522; font-family: "Public Sans", "Segoe UI", sans-serif; }
      .muted { fill: #766f69; font-family: "Public Sans", "Segoe UI", sans-serif; }
      .mono { fill: #766f69; font-family: "Cascadia Mono", Consolas, monospace; }
      .card { fill: #fffdf8; stroke: #ded7ce; stroke-width: 2; }
      .line { fill: none; stroke: #bc5138; stroke-width: 3; stroke-linecap: round; }
      .dash { fill: none; stroke: #bc5138; stroke-width: 2; stroke-dasharray: 8 10; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f2efe8"/>
  <path d="M350 260H490M710 260H850" class="line"/>
  <path d="M600 173V103M600 347v70" class="dash"/>
  <circle cx="350" cy="260" r="7" fill="#bc5138"/>
  <circle cx="490" cy="260" r="7" fill="#bc5138"/>
  <circle cx="710" cy="260" r="7" fill="#bc5138"/>
  <circle cx="850" cy="260" r="7" fill="#bc5138"/>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="280" height="220" rx="18" class="card"/>
    <rect x="490" y="150" width="220" height="220" rx="18" class="card"/>
    <rect x="850" y="150" width="280" height="220" rx="18" class="card"/>
    <rect x="450" y="28" width="300" height="76" rx="16" class="card"/>
    <rect x="450" y="416" width="300" height="76" rx="16" class="card"/>
  </g>

  <g transform="translate(100 182)">
    <g fill="#e8e2d8" stroke="#bc5138" stroke-width="2">
      <rect x="0" y="0" width="54" height="32" rx="6"/><rect x="62" y="0" width="54" height="32" rx="6"/><rect x="124" y="0" width="54" height="32" rx="6"/>
      <rect x="0" y="40" width="54" height="32" rx="6"/><rect x="62" y="40" width="54" height="32" rx="6"/><rect x="124" y="40" width="54" height="32" rx="6"/>
      <rect x="0" y="80" width="54" height="32" rx="6"/><rect x="62" y="80" width="54" height="32" rx="6"/><rect x="124" y="80" width="54" height="32" rx="6"/>
    </g>
    <text x="0" y="154" class="ink" font-size="24" font-weight="700">Home</text>
    <text x="0" y="184" class="muted" font-size="17">Tiles · A1 map · sparse cells</text>
  </g>

  <g transform="translate(525 190)">
    <rect x="0" y="0" width="150" height="76" rx="10" fill="#f5ede6" stroke="#bc5138" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" class="ink" font-size="19" font-weight="700">cell</text>
    <text x="75" y="57" text-anchor="middle" class="mono" font-size="13">embed link</text>
    <text x="0" y="122" class="muted" font-size="16">stable object ID</text>
  </g>

  <g transform="translate(880 182)">
    <text x="0" y="26" class="ink" font-size="23" font-weight="700">Objects</text>
    <text x="0" y="67" class="ink" font-size="18">Text / Markdown</text>
    <text x="0" y="101" class="ink" font-size="18">Sheets inside sheets</text>
    <text x="0" y="135" class="ink" font-size="18">Images · PDF · video</text>
    <text x="0" y="169" class="muted" font-size="16">parent links · aliases · no cycles</text>
  </g>

  <g transform="translate(475 50)">
    <text x="150" y="30" text-anchor="middle" class="ink" font-size="20" font-weight="700">workspace.json</text>
    <text x="150" y="54" text-anchor="middle" class="mono" font-size="13">portable v4 manifest</text>
  </g>
  <g transform="translate(475 438)">
    <text x="150" y="30" text-anchor="middle" class="ink" font-size="20" font-weight="700">local assets</text>
    <text x="150" y="54" text-anchor="middle" class="mono" font-size="13">asset IDs · readable files</text>
  </g>
</svg>
