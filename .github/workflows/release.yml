name: Release app packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  # Updater signing: every bundled artifact is signed with the minisign keypair
  # so the app can verify and install new releases. OWNER ACTION: the
  # TAURI_SIGNING_PRIVATE_KEY repository secret must be the private key that
  # matches plugins.updater.pubkey in src-tauri/tauri.conf.json.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: msi
            expected: msi
          - platform: macos-universal
            os: macos-14
            rust-target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            expected: dmg,tar.gz
          - platform: linux-x64
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            expected: appimage,deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate app release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate-release-version.mjs app "$RELEASE_TAG"

      - name: Validate release source branch
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          required_branch=main
          if [[ "$version" == *-alpha.* || "$version" == *-rc.* ]]; then
            required_branch=alpha
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$required_branch"; then
            echo "Tag $GITHUB_REF_NAME must identify a commit from $required_branch." >&2
            exit 1
          fi

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel=release
          if [[ "$version" == *-alpha.* ]]; then
            channel=alpha
          elif [[ "$version" == *-rc.* ]]; then
            channel=rc
          fi
          echo "VITE_TACTILE_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_TACTILE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "VITE_TACTILE_PLATFORM=${{ matrix.platform }}" >> "$GITHUB_ENV"
          echo "VITE_TACTILE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Resolve Windows bundle version
        if: matrix.platform == 'windows-x64'
        id: windows-bundle-version
        shell: pwsh
        run: |
          $version = node scripts/release/windows-bundle-version.mjs "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Windows bundle version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Inspect Apple release prerequisites
        if: matrix.platform == 'macos-universal'
        id: apple-prereqs
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_ready=false
          notarization_ready=false

          if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            signing_ready=true
          fi

          if [[ "$signing_ready" == true && -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            notarization_ready=true
          fi

          echo "signing_ready=$signing_ready" >> "$GITHUB_OUTPUT"
          echo "notarization_ready=$notarization_ready" >> "$GITHUB_OUTPUT"

          if [[ "$notarization_ready" == true ]]; then
            echo 'Apple signing and notarization prerequisites are configured.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$signing_ready" == true ]]; then
            echo 'Apple signing is configured; notarization credentials are absent, so the signed DMG will remain unnotarized.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Apple signing/notarization credentials are absent; the universal DMG will use ad-hoc signing and remain unnotarized.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # OWNER ACTION: configure the six APPLE_* repository/environment secrets above when
      # Developer ID signing and notarization are approved. No placeholder secret is used.
      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-universal' && steps.apple-prereqs.outputs.signing_ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Configure these repository secrets when a trusted Authenticode certificate
      # is available: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD,
      # and WINDOWS_TIMESTAMP_URL. WINDOWS_CERTIFICATE_THUMBPRINT is optional;
      # when omitted, the thumbprint is read from the imported PFX certificate.
      - name: Inspect Windows release prerequisites
        if: matrix.platform == 'windows-x64'
        id: windows-prereqs
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signingReady = $false
          $thumbprint = ""
          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL

          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "tactile-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $certificate = $certificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($certificate) {
              $thumbprint = $certificate.Thumbprint
              $signingReady = $true
            }
          }

          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $thumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
          }

          if ($signingReady -and -not $timestampUrl) {
            $signingReady = $false
            "A Windows certificate was found, but WINDOWS_TIMESTAMP_URL is missing; keeping this build unsigned." >> $env:GITHUB_STEP_SUMMARY
          }

          "signing_ready=$($signingReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "certificate_thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT
          "timestamp_url=$timestampUrl" >> $env:GITHUB_OUTPUT

          if ($signingReady) {
            "Windows code signing prerequisites are configured; the MSI will be signed and timestamped." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows code signing credentials are absent; the MSI will be branded but unsigned (Windows may show Unknown Publisher)." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply alpha app icon
        if: contains(github.ref_name, '-alpha.')
        shell: bash
        run: |
          set -euo pipefail
          required_icons=(32x32.png 128x128.png 128x128@2x.png icon.icns icon.ico)
          for icon in "${required_icons[@]}"; do
            if [[ ! -f "src-tauri/icons-alpha/$icon" ]]; then
              echo "Missing required alpha icon: src-tauri/icons-alpha/$icon" >&2
              exit 1
            fi
          done
          for icon in "${required_icons[@]}"; do
            cp "src-tauri/icons-alpha/$icon" "src-tauri/icons/$icon"
          done
          if [[ ! -f public/tactile-mark-alpha.svg ]]; then
            echo "Missing required alpha mark: public/tactile-mark-alpha.svg" >&2
            exit 1
          fi
          cp public/tactile-mark-alpha.svg public/tactile-mark.svg

      - name: Build signed Windows Tauri bundle
        if: matrix.platform == 'windows-x64' && steps.windows-prereqs.outputs.signing_ready == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-prereqs.outputs.certificate_thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ steps.windows-prereqs.outputs.timestamp_url }}
          WINDOWS_BUNDLE_VERSION: ${{ steps.windows-bundle-version.outputs.version }}
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tactile-windows-signing.json"
          $config = @{
            version = $env:WINDOWS_BUNDLE_VERSION
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path $configPath -Value $config -Encoding utf8

          npx --yes @tauri-apps/cli@2.11.4 build `
            --target '${{ matrix.rust-target }}' `
            --bundles '${{ matrix.bundles }}' `
            --config $configPath

      - name: Build unsigned Windows Tauri bundle
        if: matrix.platform == 'windows-x64' && steps.windows-prereqs.outputs.signing_ready != 'true'
        shell: pwsh
        env:
          WINDOWS_BUNDLE_VERSION: ${{ steps.windows-bundle-version.outputs.version }}
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tactile-windows-version.json"
          @{ version = $env:WINDOWS_BUNDLE_VERSION } |
            ConvertTo-Json |
            Set-Content -Path $configPath -Encoding utf8

          npx --yes @tauri-apps/cli@2.11.4 build `
            --target '${{ matrix.rust-target }}' `
            --bundles '${{ matrix.bundles }}' `
            --config $configPath

      - name: Build non-Windows Tauri bundle
        if: matrix.platform != 'windows-x64'
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-prereqs.outputs.signing_ready == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.platform }}' == 'macos-universal' && '${{ steps.apple-prereqs.outputs.signing_ready }}' != 'true' ]]; then
            # Tauri otherwise attempts to sign with the empty identity on a
            # clean hosted runner. Ad-hoc signing avoids the keychain while
            # the release owner supplies Developer ID credentials.
            APPLE_SIGNING_IDENTITY=- npx --yes @tauri-apps/cli@2.11.4 build \
              --target '${{ matrix.rust-target }}' \
              --bundles '${{ matrix.bundles }}' \
              --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          else
            npx --yes @tauri-apps/cli@2.11.4 build \
              --target '${{ matrix.rust-target }}' \
              --bundles '${{ matrix.bundles }}'
          fi

      - name: Sign macOS DMG
        if: matrix.platform == 'macos-universal' && steps.apple-prereqs.outputs.signing_ready == 'true'
        id: mac-sign
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected one universal DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${dmgs[0]}"
          codesign --verify --verbose=2 "${dmgs[0]}"
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Notarize and staple macOS DMG
        if: matrix.platform == 'macos-universal' && steps.apple-prereqs.outputs.notarization_ready == 'true'
        id: mac-notarize
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected one universal DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"
          echo 'notarized=true' >> "$GITHUB_OUTPUT"

      - name: Set macOS artifact status label
        if: matrix.platform == 'macos-universal'
        id: release-label
        shell: bash
        env:
          SIGNING_READY: ${{ steps.apple-prereqs.outputs.signing_ready }}
          NOTARIZED: ${{ steps.mac-notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          suffix=ad-hoc
          if [[ "${SIGNING_READY:-false}" == true ]]; then
            suffix=signed-unnotarized
          fi
          if [[ "${NOTARIZED:-false}" == true ]]; then
            suffix=signed-notarized
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "macOS artifact label: $suffix" >> "$GITHUB_STEP_SUMMARY"

      - name: Set artifact label
        id: artifact-label
        shell: bash
        env:
          MACOS_STATUS: ${{ steps.release-label.outputs.suffix }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          build_type=release
          if [[ "$version" == *-alpha.* ]]; then
            build_type=alpha
          fi
          suffix="$build_type"
          if [[ -n "${MACOS_STATUS:-}" ]]; then
            suffix="$suffix-$MACOS_STATUS"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage-artifacts.mjs \
            --platform '${{ matrix.platform }}' \
            --source 'src-tauri/target/${{ matrix.rust-target }}/release/bundle' \
            --output release-artifacts \
            --artifact-suffix '${{ steps.artifact-label.outputs.suffix }}'

      - name: Validate release artifacts
        shell: bash
        run: node scripts/release/validate-artifacts.mjs --dir release-artifacts --expected '${{ matrix.expected }}'

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactile-${{ matrix.platform }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tactile-*
          path: release-artifacts
          merge-multiple: true

      - name: Validate release matrix
        run: node scripts/release/validate-artifacts.mjs --dir release-artifacts --expected msi,dmg,tar.gz,appimage,deb

      - name: Generate SHA-256 checksums
        run: node scripts/release/create-checksums.mjs --dir release-artifacts --output release-artifacts/SHA256SUMS.txt

      - name: Verify SHA-256 checksums and artifact coverage
        run: node scripts/release/validate-artifacts.mjs --dir release-artifacts --expected msi,dmg,tar.gz,appimage,deb --checksums release-artifacts/SHA256SUMS.txt

      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/create-updater-manifest.mjs \
            --dir release-artifacts \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --output release-artifacts/latest.json

      - name: Upload assembled release assets
        uses: actions/upload-artifact@v4
        with:
          name: tactile-release-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published versions are immutable." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          release_flags=(--generate-notes --title "Tactile $GITHUB_REF_NAME")
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--draft)
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* "${release_flags[@]}"

  promote-nightly:
    name: Promote nightly updater manifest
    if: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-rc.') }}
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: updater-nightly
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download candidate manifest
        uses: actions/download-artifact@v4
        with:
          name: tactile-release-${{ github.ref_name }}
          path: nightly-candidate

      - name: Compare with current nightly manifest
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--candidate nightly-candidate/latest.json --github-output "$GITHUB_OUTPUT")
          if gh release view nightly >/dev/null 2>&1; then
            mkdir current-nightly
            gh release download nightly --pattern latest.json --dir current-nightly
            args+=(--current current-nightly/latest.json)
          fi
          node scripts/release/promote-updater-channel.mjs "${args[@]}"

      - name: Publish nightly channel manifest
        if: steps.promotion.outputs.promote == 'true' || steps.promotion.outputs.promote == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly nightly-candidate/latest.json --clobber
          else
            gh release create nightly nightly-candidate/latest.json \
              --prerelease \
              --title "Tactile Nightly Updates" \
              --notes "Mutable updater metadata for alpha and release-candidate builds. Installers remain on immutable versioned releases."
          fi
