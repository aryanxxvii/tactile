name: Marketplace artifacts

on:
  pull_request:
    paths:
      - "marketplace/**"
      - "scripts/build-marketplace.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/marketplace.yml"
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "scripts/build-marketplace.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/marketplace.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run marketplace:build
      - name: Verify generated catalog and bundles are committed
        run: |
          git diff --exit-code -- marketplace/dist
          test -z "$(git ls-files --others --exclude-standard -- marketplace/dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: tactile-marketplace
          path: marketplace/dist
          if-no-files-found: error
